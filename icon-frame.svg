<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#0F2847"/>
      <stop offset="100%" stop-color="#07131F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle blue glow from behind building -->
  <ellipse cx="512" cy="780" rx="340" ry="60" fill="rgba(0,122,255,0.18)"/>

  <!-- ─── Steel Frame Building ─── -->
  <!-- Ground / Foundation -->
  <rect x="160" y="770" width="704" height="20" rx="6" fill="rgba(255,255,255,0.6)"/>

  <!-- 4 vertical columns -->
  <rect x="188" y="280" width="22" height="510" rx="5" fill="white"/>
  <rect x="420" y="280" width="22" height="510" rx="5" fill="white"/>
  <rect x="582" y="280" width="22" height="510" rx="5" fill="white"/>
  <rect x="814" y="280" width="22" height="510" rx="5" fill="white"/>

  <!-- 4 horizontal floor beams -->
  <rect x="188" y="270" width="648" height="18" rx="5" fill="white"/>
  <rect x="188" y="440" width="648" height="18" rx="5" fill="white"/>
  <rect x="188" y="610" width="648" height="18" rx="5" fill="white"/>
  <rect x="188" y="758" width="648" height="18" rx="5" fill="white"/>

  <!-- ── X-bracing: left bay (shows under construction) ── -->
  <line x1="210" y1="280" x2="420" y2="440" stroke="white" stroke-width="11" stroke-linecap="round" opacity="0.65"/>
  <line x1="420" y1="280" x2="210" y2="440" stroke="white" stroke-width="11" stroke-linecap="round" opacity="0.65"/>

  <!-- ── X-bracing: right bay bottom ── -->
  <line x1="604" y1="610" x2="814" y2="770" stroke="white" stroke-width="11" stroke-linecap="round" opacity="0.65"/>
  <line x1="814" y1="610" x2="604" y2="770" stroke="white" stroke-width="11" stroke-linecap="round" opacity="0.65"/>

  <!-- ── Center bay: partial wall (mid floors = done) ── -->
  <!-- Floor panels (glass/slab) in center bay, 2nd floor only -->
  <rect x="444" y="460" width="136" height="136" rx="4" fill="rgba(0,122,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- ── Crane on top-right ── -->
  <!-- Crane mast -->
  <rect x="800" y="170" width="20" height="120" rx="4" fill="rgba(255,200,0,0.9)"/>
  <!-- Crane jib -->
  <rect x="640" y="160" width="210" height="16" rx="4" fill="rgba(255,200,0,0.9)"/>
  <!-- Crane counter-jib -->
  <rect x="820" y="160" width="72" height="12" rx="4" fill="rgba(255,200,0,0.7)"/>
  <!-- Hook cable -->
  <line x1="700" y1="176" x2="700" y2="280" stroke="rgba(255,200,0,0.8)" stroke-width="5" stroke-linecap="round"/>
  <!-- Hook -->
  <path d="M 692,280 Q 674,280 674,300 Q 674,318 692,322 L 692,310" fill="none" stroke="rgba(255,200,0,0.9)" stroke-width="5" stroke-linecap="round"/>
</svg>
