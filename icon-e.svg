<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#00C896"/>
      <stop offset="100%" stop-color="#007A5A"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.96)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.88)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <ellipse cx="380" cy="200" rx="360" ry="150" fill="rgba(255,255,255,0.06)"/>

  <!-- White table card -->
  <rect x="148" y="232" width="728" height="560" rx="28" fill="url(#card)"/>

  <!-- Card shadow hint -->
  <rect x="148" y="232" width="728" height="560" rx="28" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

  <!-- Header bar (green accent) -->
  <rect x="148" y="232" width="728" height="72" rx="28" fill="#00C896"/>
  <rect x="148" y="276" width="728" height="28" fill="#00C896"/>

  <!-- Header column labels (white on green) -->
  <rect x="188" y="256" width="140" height="14" rx="7" fill="rgba(255,255,255,0.9)"/>
  <rect x="730" y="256" width="90" height="14" rx="7" fill="rgba(255,255,255,0.9)"/>

  <!-- Vertical dividers -->
  <line x1="148" y1="304" x2="876" y2="304" stroke="rgba(0,0,0,0.07)" stroke-width="1.5"/>
  <line x1="700" y1="232" x2="700" y2="792" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

  <!-- Second table section header (mid green accent) -->
  <rect x="148" y="540" width="728" height="50" fill="#00C896" opacity="0.15"/>
  <rect x="188" y="554" width="120" height="13" rx="6" fill="#007A5A" opacity="0.6"/>

  <!-- Horizontal row separators -->
  <line x1="148" y1="358" x2="876" y2="358" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="408" x2="876" y2="408" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="458" x2="876" y2="458" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="508" x2="876" y2="508" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="590" x2="876" y2="590" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="640" x2="876" y2="640" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="690" x2="876" y2="690" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <line x1="148" y1="740" x2="876" y2="740" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>

  <!-- Name column data (dark gray text pillars) -->
  <rect x="188" y="322" width="186" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="372" width="160" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="422" width="172" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="472" width="148" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="608" width="170" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="656" width="154" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="706" width="178" height="14" rx="7" fill="#1C1C1E" opacity="0.75"/>
  <rect x="188" y="756" width="142" height="14" rx="7" fill="#1C1C1E" opacity="0.45"/>

  <!-- Quantity column data (green accent) -->
  <rect x="730" y="322" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="372" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="422" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="472" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="608" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="656" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
  <rect x="730" y="706" width="96" height="14" rx="7" fill="#007A5A" opacity="0.75"/>
</svg>
