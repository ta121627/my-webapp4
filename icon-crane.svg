<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="10%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0A2952"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="rgba(100,181,246,0.25)"/>
      <stop offset="100%" stop-color="rgba(100,181,246,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Sky gradient overlay -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#sky)"/>

  <!-- Ground line -->
  <rect x="0" y="860" width="1024" height="164" rx="0" fill="rgba(0,0,0,0.25)" clip-path="url(#rnd)"/>
  <defs><clipPath id="rnd"><rect width="1024" height="1024" rx="220" ry="220"/></clipPath></defs>

  <!-- Building silhouette (background) -->
  <rect x="90" y="560" width="180" height="300" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="110" y="590" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="144" y="590" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="178" y="590" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="110" y="640" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="144" y="640" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="178" y="640" width="24" height="32" rx="3" fill="rgba(255,255,255,0.12)"/>

  <!-- ─── Tower Crane (main, white + yellow) ─── -->

  <!-- Foundation/base -->
  <rect x="530" y="836" width="100" height="28" rx="6" fill="white" opacity="0.9"/>

  <!-- Tower mast (main vertical) -->
  <rect x="549" y="310" width="62" height="550" rx="6" fill="white"/>

  <!-- Tower internal ladder/bracing (subtle) -->
  <line x1="549" y1="410" x2="611" y2="460" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>
  <line x1="611" y1="410" x2="549" y2="460" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>
  <line x1="549" y1="510" x2="611" y2="560" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>
  <line x1="611" y1="510" x2="549" y2="560" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>
  <line x1="549" y1="610" x2="611" y2="660" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>
  <line x1="611" y1="610" x2="549" y2="660" stroke="rgba(0,50,120,0.25)" stroke-width="5"/>

  <!-- Slewing unit / cab (yellow) -->
  <rect x="530" y="280" width="100" height="62" rx="8" fill="#FFCA28"/>
  <rect x="530" y="302" width="100" height="20" rx="4" fill="rgba(0,0,0,0.15)"/>

  <!-- Main jib (long arm left) -->
  <rect x="168" y="258" width="540" height="30" rx="8" fill="white"/>
  <!-- Jib taper (thicker near tower) -->
  <rect x="490" y="248" width="220" height="48" rx="8" fill="white"/>

  <!-- Counter-jib (short arm right) -->
  <rect x="612" y="260" width="220" height="24" rx="6" fill="white" opacity="0.9"/>
  <!-- Counter weight -->
  <rect x="792" y="240" width="60" height="56" rx="10" fill="#FFCA28"/>

  <!-- Support cable from peak to jib tip -->
  <line x1="580" y1="258" x2="200" y2="258" stroke="rgba(255,255,255,0)" stroke-width="0"/>
  <!-- Peak support strut -->
  <line x1="580" y1="248" x2="260" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
  <line x1="580" y1="248" x2="800" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>

  <!-- Peak triangle -->
  <polygon points="560,220 600,220 580,186" fill="#FFCA28"/>

  <!-- Trolley on jib -->
  <rect x="340" y="252" width="32" height="36" rx="4" fill="#FFCA28"/>

  <!-- Hook cable (from trolley) -->
  <line x1="356" y1="290" x2="356" y2="550" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

  <!-- Hook -->
  <path d="M 340,548 Q 312,548 312,578 Q 312,608 340,614 L 340,596" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

  <!-- Load (small box hanging from hook) -->
  <rect x="304" y="615" width="72" height="52" rx="6" fill="rgba(255,202,40,0.7)"/>
</svg>
