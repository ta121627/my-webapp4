<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#E07B00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Subtle top glow -->
  <ellipse cx="512" cy="140" rx="420" ry="130" fill="rgba(255,255,255,0.12)"/>

  <!-- ─── Hard Hat ─── -->
  <!-- Dome (upper half-ellipse: centered 512,620, rx=330, ry=310) -->
  <path d="M 182,620 A 330,310 0 0 1 842,620 Z" fill="white"/>

  <!-- Brim (wider ellipse at dome base) -->
  <ellipse cx="512" cy="620" rx="390" ry="55" fill="white"/>

  <!-- Brim depth shadow (underside of brim) -->
  <ellipse cx="512" cy="655" rx="390" ry="38" fill="rgba(160,80,0,0.18)"/>

  <!-- Dome highlight (inner curved shine) -->
  <path d="M 320,500 Q 400,350 512,320 Q 624,350 640,440" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="18" stroke-linecap="round"/>

  <!-- Chin strap attachment points -->
  <rect x="186" y="606" width="28" height="28" rx="6" fill="rgba(200,100,0,0.3)"/>
  <rect x="810" y="606" width="28" height="28" rx="6" fill="rgba(200,100,0,0.3)"/>

  <!-- Ventilation slots (decorative) -->
  <rect x="468" y="360" width="16" height="48" rx="8" fill="rgba(200,100,0,0.2)"/>
  <rect x="498" y="340" width="28" height="18" rx="9" fill="rgba(200,100,0,0.15)"/>
</svg>
